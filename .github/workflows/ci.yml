name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons-cache
  # Pinned so the check is reproducible: clang-format reflows code differently
  # between major versions, and `make format-check` has to agree with CI.
  CLANG_FORMAT_VERSION: 20.1.7

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install clang-format
        run: pip install "clang-format==${{ env.CLANG_FORMAT_VERSION }}"

      # Mirrors `make format-check`: src/rpc_gen is protoc output and is skipped.
      - name: Check formatting
        run: |
          find src -path src/rpc_gen -prune -o \( -name '*.cpp' -o -name '*.h' \) -print | xargs clang-format --dry-run --Werror

  build:
    name: Build (${{ matrix.platform }}, ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            target: template_debug
            runner: ubuntu-latest
          - platform: linux
            target: template_release
            runner: ubuntu-latest
          - platform: macos
            target: template_release
            runner: macos-latest
    steps:
      # cppdisplacementx is a private sibling repository, and the default
      # GITHUB_TOKEN is scoped to this repo alone, so it cannot clone it. Add a
      # SUBMODULE_TOKEN secret (a PAT with read access to both repos) to check
      # submodules out; without it, checkout falls back to the default token,
      # which is enough only while every submodule is public.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: pip install scons

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-${{ matrix.platform }}-${{ matrix.target }}-${{ hashFiles('.gitmodules', 'SConstruct') }}
          restore-keys: |
            scons-${{ matrix.platform }}-${{ matrix.target }}-

      # godot-cpp's SConstruct picks up the SCONS_CACHE env var (set above)
      # and routes the build through SCons CacheDir.
      - name: Build
        run: scons platform=${{ matrix.platform }} target=${{ matrix.target }}

      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: libprocedural_city-${{ matrix.platform }}-${{ matrix.target }}
          path: demo/addons/procedural_city/bin/
